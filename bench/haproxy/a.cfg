# HAProxy at site a: the export side, in the role of the Strait gateway's export listener.
global
    nbthread 2
    maxconn 20000

defaults
    mode tcp
    timeout connect 2s
    timeout client 1h
    timeout server 1h

frontend export
    bind :7000
    default_backend server

backend server
    # The headless Service resolves to the server pod's address, as Envoy's endpoints do.
    # The name ends with a dot, so musl's resolver does not try the search domains first.
    server srv srv-a-headless.bench.svc.cluster.local.:7001
