# HAProxy at site b: the import side, in the role of the Strait gateway's import listener.
# run.sh replaces PEER_DIRECT_IP with site a's address on the direct link.
global
    nbthread 2
    maxconn 20000

defaults
    mode tcp
    timeout connect 2s
    timeout client 1h
    timeout server 1h

frontend import
    bind :7000
    default_backend peer

backend peer
    # TCP keepalive towards the peer, as the Strait gateway sets on its upstream connections.
    option srvtcpka
    srvtcpka-idle 30s
    srvtcpka-intvl 5s
    srvtcpka-cnt 3
    server a PEER_DIRECT_IP:32100
