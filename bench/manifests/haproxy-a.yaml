# Site a: the HAProxy that plays the export side. run.sh makes its ConfigMap haproxy-a from bench/haproxy/a.cfg.
apiVersion: apps/v1
kind: Deployment
metadata: {name: haproxy, namespace: bench}
spec:
  replicas: 1
  selector: {matchLabels: {app: haproxy}}
  template:
    metadata: {labels: {app: haproxy}}
    spec:
      containers:
        - name: haproxy
          image: haproxy:3.2.26-alpine
          imagePullPolicy: Never
          ports: [{containerPort: 7000}]
          readinessProbe: {tcpSocket: {port: 7000}, periodSeconds: 2}
          resources: {requests: {cpu: "1", memory: 64Mi}}
          volumeMounts: [{name: cfg, mountPath: /usr/local/etc/haproxy, readOnly: true}]
      volumes: [{name: cfg, configMap: {name: haproxy-a}}]
---
# Reached by HAProxy at site b on the node's direct link address, as the gateway's export ports are.
apiVersion: v1
kind: Service
metadata: {name: haproxy-a, namespace: bench}
spec:
  type: NodePort
  selector: {app: haproxy}
  ports: [{name: tcp, port: 7000, targetPort: 7000, nodePort: 32100}]
