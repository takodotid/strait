# Site a: the server and the member Services.
apiVersion: apps/v1
kind: Deployment
metadata: {name: srv, namespace: bench}
spec:
  replicas: 1
  selector: {matchLabels: {app: srv}}
  template:
    metadata: {labels: {app: srv}}
    spec:
      containers:
        - name: srv
          image: strait-bench-tcpbench:dev
          imagePullPolicy: Never
          args: [server, -listen, ":7001"]
          ports: [{containerPort: 7001}]
          readinessProbe: {tcpSocket: {port: 7001}, periodSeconds: 2}
          resources: {requests: {cpu: "1", memory: 32Mi}}
---
# The member's Service. Its port differs from the target port, so endpoint-direct must use the target port.
apiVersion: v1
kind: Service
metadata: {name: srv-a, namespace: bench}
spec:
  selector: {app: srv}
  ports: [{name: tcp, port: 7000, targetPort: 7001}]
---
apiVersion: v1
kind: Service
metadata: {name: srv-a-headless, namespace: bench}
spec:
  clusterIP: None
  selector: {app: srv}
  ports: [{name: tcp, port: 7001, targetPort: 7001}]
