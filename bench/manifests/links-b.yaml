# Site b's peer a and its two links. run.sh replaces PEER_PUBLIC_KEY, PEER_DIRECT_IP and PEER_WAN_IP,
# and changes endpointDirect and the wireguard cost between paths.
apiVersion: strait.tako.id/v1alpha1
kind: SitePeer
metadata: {name: a}
spec:
  wireguard: {publicKey: PEER_PUBLIC_KEY}
---
apiVersion: strait.tako.id/v1alpha1
kind: SiteLink
metadata: {name: a-direct}
spec:
  peer: a
  transport: direct
  encryption: None
  cost: 10
  direct: {address: PEER_DIRECT_IP}
---
apiVersion: strait.tako.id/v1alpha1
kind: SiteLink
metadata: {name: a-wireguard}
spec:
  peer: a
  transport: wireguard
  cost: 20
  wireguard:
    listenPort: 32010
    endpoint: PEER_WAN_IP:32010
    persistentKeepalive: 5s
    address: 100.64.10.2/32
    peerAddress: 100.64.10.1
