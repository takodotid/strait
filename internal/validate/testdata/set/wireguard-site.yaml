# want: Error SiteLink/b-wireguard: spec.transport: Invalid value: "wireguard": the wireguard transport needs spec.wireguard on Site/a
apiVersion: strait.tako.id/v1
kind: Site
metadata:
  name: a
---
apiVersion: strait.tako.id/v1
kind: SitePeer
metadata:
  name: b
spec:
  wireguard:
    publicKey: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBA=
---
apiVersion: strait.tako.id/v1
kind: SiteLink
metadata:
  name: b-wireguard
spec:
  peer: b
  transport: wireguard
  wireguard:
    address: 10.200.0.1/30
    peerAddress: 10.200.0.2
