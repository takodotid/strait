# want: spec.wireguard.publicKey: Invalid value: "not-a-key": must be a base64 WireGuard key, matching ^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw480]=$
apiVersion: strait.tako.id/v1
kind: SitePeer
metadata:
  name: key-pattern
spec:
  wireguard:
    publicKey: not-a-key
---
# want: spec.wireguard.publicKey: Required value
apiVersion: strait.tako.id/v1
kind: SitePeer
metadata:
  name: key-missing
spec:
  wireguard: {}
---
# An explicit 0 is a value, not a missing field: the API server does not default it (issue #64).
# want: spec.controlPort: Invalid value: 0: must be between 1 and 65535
apiVersion: strait.tako.id/v1
kind: SitePeer
metadata:
  name: control-port-zero
spec:
  controlPort: 0
