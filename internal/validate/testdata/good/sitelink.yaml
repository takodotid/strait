apiVersion: strait.tako.id/v1alpha1
kind: SiteLink
metadata:
  name: b-direct
spec:
  peer: b
  transport: direct
  encryption: None
  cost: 10
  direct:
    address: 192.0.2.10
    endpointDirect: true
---
apiVersion: strait.tako.id/v1alpha1
kind: SiteLink
metadata:
  name: b-wireguard
spec:
  peer: b
  transport: wireguard
  wireguard:
    endpoint: 198.51.100.20:51820
    address: 10.200.0.1/30
    peerAddress: 10.200.0.2
---
apiVersion: strait.tako.id/v1alpha1
kind: SiteLink
metadata:
  name: c-wireguard
spec:
  peer: c
  transport: wireguard
  encryption: WireGuard
  cost: 0
  wireguard:
    listenPort: 51821
    address: 10.200.0.5/30
    peerAddress: 10.200.0.6
    persistentKeepalive: 10s
