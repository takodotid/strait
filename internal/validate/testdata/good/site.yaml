# Every default left unset.
apiVersion: strait.tako.id/v1
kind: Site
metadata:
  name: a
---
apiVersion: strait.tako.id/v1
kind: Site
metadata:
  name: b
spec:
  gateway:
    controlPort: 30900
    exportPorts:
      first: 30901
      last: 31899
    importPorts:
      first: 15000
      last: 15999
    peerPort: 14999
  exchange:
    pollInterval: 2s
    peerTimeout: 6s
  wireguard:
    privateKeySecretRef:
      name: strait-wireguard
---
apiVersion: strait.tako.id/v1
kind: Site
metadata:
  name: c
spec:
  gateway:
    directService:
      type: LoadBalancer
      loadBalancerSourceRanges: [192.0.2.21/32, 2001:db8::/64]
      allocateLoadBalancerNodePorts: false
      externalTrafficPolicy: Local
    wireGuardService:
      type: NodePort
      externalTrafficPolicy: Local
---
# The gateway Lease of a site whose API server can stall for up to 10s.
apiVersion: strait.tako.id/v1
kind: Site
metadata:
  name: d
spec:
  gateway:
    lease:
      duration: 15s
      renewDeadline: 10s
      retryPeriod: 2s
---
# A gateway Service without a type keeps none: the CRD defaults the type only when the whole Service is absent.
apiVersion: strait.tako.id/v1
kind: Site
metadata:
  name: service-without-type
spec:
  gateway:
    directService:
      annotations: {example.com/internal: "true"}
