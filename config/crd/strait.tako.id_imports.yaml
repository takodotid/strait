                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              gatewayPort:
                description: GatewayPort is the local gateway port of this import.
                  Allocated from the Site's importPorts and kept.
                format: int32
                type: integer
              remotePort:
                description: RemotePort is the export's gateway port at the peer,
                  from the peer's last document.
                format: int32
                type: integer
              remoteReady:
                description: RemoteReady is the export's readiness at the peer, from
                  the peer's last document.
                type: boolean
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: with port set, the name must be a DNS-1035 label, since it names
            a Service
          rule: '!has(self.spec.port) || (self.metadata.name.matches(''^[a-z]([-a-z0-9]*[a-z0-9])?$'')
