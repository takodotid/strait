{{- if .Values.networkPolicy.enabled }}
# Only gateway pods reach the controller's xDS and observation ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: strait-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strait.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: strait
      app.kubernetes.io/component: controller
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: strait
              app.kubernetes.io/component: gateway
      ports:
        - {port: 8082}
        - {port: 18000}
    # Probes, from the kubelet.
    - ports:
        - {port: 8081}
    # Metrics.
    - ports:
        - {port: 8080}
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if .Values.networkPolicy.gateway.enabled }}
---
# The gateway pods admit the pods of this cluster, which reach imports and poll peers through the gateway, and the peer
# gateways. The probe port admits every source, as the controller's does: some CNIs enforce policies on host traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: strait-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strait.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: strait
      app.kubernetes.io/component: gateway
  policyTypes: ["Ingress"]
  ingress:
    # Probes, from the kubelet.
    - ports:
        - {port: 8090}
    - from:
        - namespaceSelector: {}
    {{- with .Values.networkPolicy.gateway.peerCIDRs }}
    - from:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
