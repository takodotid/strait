{{- if .Values.networkPolicy.enabled }}
# Only gateway pods reach the controller's xDS and observation ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: strait-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strait.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: strait
      app.kubernetes.io/component: controller
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: strait
              app.kubernetes.io/component: gateway
      ports:
        - {port: 8082}
        - {port: 18000}
    # Probes, from the kubelet.
    - ports:
        - {port: 8081}
    # Metrics.
    - ports:
        - {port: 8080}
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if .Values.networkPolicy.gateway.enabled }}
---
# The gateway pods admit the pods of this cluster to the import and export ports, the controller to the peer port,
# through which it polls peers, and the peer gateways to the control and export ports and the WireGuard listen ports.
# The probe port admits every source, as the controller's does: some CNIs enforce policies on host traffic.
{{- $ports := include "strait.gatewayPorts" . | fromJson }}
{{- $gw := .Values.networkPolicy.gateway }}
{{- if and $gw.peerCIDRs (not (hasKey $gw "wireGuardPorts")) }}
{{- fail "networkPolicy.gateway.wireGuardPorts is required with networkPolicy.gateway.peerCIDRs: list the listen ports of the site's wireguard SiteLinks, or set [] when it has none" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: strait-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strait.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: strait
      app.kubernetes.io/component: gateway
  policyTypes: ["Ingress"]
  ingress:
    # Probes, from the kubelet.
    - ports:
        - {port: 8090}
    # Metrics.
    - ports:
        - {port: 8091}
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # Clients of imports and exports.
    - from:
        - namespaceSelector: {}
      ports:
        - {{ include "strait.policyPorts" $ports.importPorts }}
        - {{ include "strait.policyPorts" $ports.exportPorts }}
    # The controller, which polls peers through the peer port.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: strait
              app.kubernetes.io/component: controller
      ports:
        - {port: {{ int $ports.peerPort }}}
    {{- with $gw.peerCIDRs }}
    # The peer gateways: the control and export ports over direct links, and the WireGuard listen ports.
    - from:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - {port: {{ int $ports.controlPort }}}
        - {{ include "strait.policyPorts" $ports.exportPorts }}
        {{- range $gw.wireGuardPorts }}
        {{- if . }}
        - {protocol: UDP, port: {{ int . }}}
        {{- end }}
        {{- end }}
    {{- end }}
{{- end }}
