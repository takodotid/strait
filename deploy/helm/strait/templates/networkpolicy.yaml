{{- if .Values.networkPolicy.enabled }}
# Only gateway pods reach the controller's xDS and observation ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: strait-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strait.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: strait
      app.kubernetes.io/component: controller
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: strait
              app.kubernetes.io/component: gateway
      ports:
        - {port: 8082}
        - {port: 18000}
    # Probes, from the kubelet.
    - ports:
        - {port: 8081}
    # Metrics.
    - ports:
        - {port: 8080}
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if .Values.networkPolicy.gateway.enabled }}
---
# The gateway pods admit the pods of this cluster to the import and export ports, the controller to the peer port,
# through which it polls peers, and the peer gateways. The probe port admits every source, as the controller's does:
# some CNIs enforce policies on host traffic.
{{- $ports := include "strait.gatewayPorts" . | fromJson }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: strait-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strait.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: strait
      app.kubernetes.io/component: gateway
  policyTypes: ["Ingress"]
  ingress:
    # Probes, from the kubelet.
    - ports:
        - {port: 8090}
    # Metrics.
    - ports:
        - {port: 8091}
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # Clients of imports and exports.
    - from:
        - namespaceSelector: {}
      ports:
        - {{ include "strait.policyPorts" $ports.importPorts }}
        - {{ include "strait.policyPorts" $ports.exportPorts }}
    # The controller, which polls peers through the peer port.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: strait
              app.kubernetes.io/component: controller
      ports:
        - {port: {{ int $ports.peerPort }}}
    {{- with .Values.networkPolicy.gateway.peerCIDRs }}
    - from:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
