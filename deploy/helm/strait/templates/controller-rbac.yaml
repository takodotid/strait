{{- $namespaces := .Values.controller.namespaces | default list }}
{{- $namespacedReads := and $namespaces .Values.controller.namespacedReads }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: strait-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strait.labels" . | nindent 4 }}
---
# Cluster-wide rules of RFC0007's controller table.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-controller
  labels:
    {{- include "strait.labels" . | nindent 4 }}
rules:
  - apiGroups: ["strait.tako.id"]
    resources: ["siteservices", "sites", "sitepeers", "sitelinks"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["strait.tako.id"]
    resources: ["exports", "imports"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["strait.tako.id"]
    resources: ["siteservices/status", "sites/status", "sitepeers/status", "exports/status", "imports/status"]
    verbs: ["get", "update", "patch"]
  {{- if not $namespacedReads }}
  # Reads in every namespace. With controller.namespacedReads, the Roles below grant them in those namespaces only.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- if not $namespaces }}
  # Writes in every namespace. With controller.namespaces, the Roles below grant them in those namespaces only.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["create", "update", "patch", "delete"]
  {{- end }}
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  {{- if and .Values.cnpg.enabled (not $namespacedReads) }}
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "poolers"]
    verbs: ["get", "list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-controller
  labels:
    {{- include "strait.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-controller
subjects:
  - kind: ServiceAccount
    name: strait-controller
    namespace: {{ .Release.Namespace }}
---
# Namespaced rules: the gateway lease and pods, and the controller's own leader election.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: strait-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strait.labels" . | nindent 4 }}
rules:
  # patch: the deletion cost of the gateway pods, so that a rollout moves the gateway Lease once.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
  # The gateway Lease and its own. RBAC cannot limit create to a name.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create"]
  # Its own leader election only: never the gateway Lease.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["strait-controller"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: strait-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strait.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: strait-controller
subjects:
  - kind: ServiceAccount
    name: strait-controller
    namespace: {{ .Release.Namespace }}
{{- if $namespaces }}
{{- range append $namespaces .Release.Namespace | uniq }}
---
# The writes of Services and EndpointSlices in one namespace of controller.namespaces, or in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-controller-writes
  namespace: {{ . }}
  labels:
    {{- include "strait.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-controller-writes
  namespace: {{ . }}
  labels:
    {{- include "strait.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-controller-writes
subjects:
  - kind: ServiceAccount
    name: strait-controller
    namespace: {{ $.Release.Namespace }}
{{- if $namespacedReads }}
---
# The reads of Services, EndpointSlices and CloudNativePG's objects in one namespace of controller.namespaces, or in
# the release namespace, with controller.namespacedReads.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-controller-reads
  namespace: {{ . }}
  labels:
    {{- include "strait.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  {{- if $.Values.cnpg.enabled }}
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "poolers"]
    verbs: ["get", "list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-controller-reads
  namespace: {{ . }}
  labels:
    {{- include "strait.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-controller-reads
subjects:
  - kind: ServiceAccount
    name: strait-controller
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
