apiVersion: v1
kind: ServiceAccount
metadata:
  name: strait-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strait.labels" . | nindent 4 }}
---
# Cluster-wide rules of RFC0007's controller table.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-controller
  labels:
    {{- include "strait.labels" . | nindent 4 }}
rules:
  - apiGroups: ["strait.tako.id"]
    resources: ["siteservices", "sites", "sitepeers", "sitelinks"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["strait.tako.id"]
    resources: ["exports", "imports"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["strait.tako.id"]
    resources: ["siteservices/status", "sites/status", "sitepeers/status", "exports/status", "imports/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  {{- if .Values.cnpg.enabled }}
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "poolers"]
    verbs: ["get", "list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-controller
  labels:
    {{- include "strait.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-controller
subjects:
  - kind: ServiceAccount
    name: strait-controller
    namespace: {{ .Release.Namespace }}
---
# Namespaced rules: the gateway lease and pods, and the controller's own leader election.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: strait-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strait.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: strait-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strait.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: strait-controller
subjects:
  - kind: ServiceAccount
    name: strait-controller
    namespace: {{ .Release.Namespace }}
