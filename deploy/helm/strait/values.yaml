image:
  repository: ghcr.io/takodotid/strait
  # Defaults to the chart's appVersion.
  tag: ""
  # The image's digest, sha256:..., which pins it. A released chart pins its own image by digest while tag and digest
  # are both empty: a mirror of the image must keep its digest (README, Verify a release).
  digest: ""
  pullPolicy: IfNotPresent

envoy:
  image:
    repository: envoyproxy/envoy
    tag: distroless-v1.40.2@sha256:09ca6f2140a61ad8df11779a4a30d52b48433d444466328494f9188c9c35eded
    pullPolicy: IfNotPresent
  # Envoy worker threads.
  concurrency: 2
  logLevel: warn

controller:
  logLevel: info
  # The namespaces where the controller may write Services and EndpointSlices: those of the SiteServices and the
  # Imports of this site. The release namespace, for the gateway Services, is added. Empty: every namespace. Each
  # namespace must exist before helm install or helm upgrade. Reads stay cluster-wide unless namespacedReads is true
  # (RFC0007).
  namespaces: []
  # true: the controller also reads Services, EndpointSlices and CloudNativePG's objects in those namespaces only, so
  # that its cache holds only theirs (docs/sizing.md). An Export in another namespace then has no ready endpoint.
  # Needs namespaces.
  namespacedReads: false
  # The controller sets the Go runtime's soft memory limit to 90% of limits.memory. Size it to the cluster
  # (docs/sizing.md).
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
  # Before helm upgrade or helm rollback changes anything, a Job runs the release's image once, on the controller's
  # node when a controller pod runs, with the scheduling values below. When the image cannot be pulled within
  # deadlineSeconds, the Job fails, and so does the upgrade, while the old controller still runs. Helm gives up first
  # after its --timeout, 5m by default.
  prePull:
    enabled: true
    deadlineSeconds: 600
  # Scheduling of the controller pod. A PriorityClass keeps it from being preempted: while the controller is down,
  # the other sites count this site's members Unknown.
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}

gateway:
  # One replica is active; the others are warm standbys (RFC0005).
  replicas: 2
  # The gateway agent's log level: error, info, or debug. Info logs each link that fails, comes back, or starts or
  # stops carrying traffic.
  logLevel: info
  # Scheduling of the gateway pods.
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  # How the replicas spread over nodes: preferred or required. With required, each replica needs a node of its own,
  # and a rollout needs one node more than replicas, for the new pod it starts first.
  antiAffinity: preferred
  # Replaces the chart's affinity, antiAffinity included, when set.
  affinity: {}
  # Lets a drain evict one gateway pod at a time, and a pod that is not ready at any time.
  podDisruptionBudget:
    enabled: true
  resources:
    # Envoy's latency depends on spare CPU on its node. Size its request to the site's traffic (docs/benchmark.md).
    envoy:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {memory: 512Mi}
    agent:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}

# The local Site. The chart renders it so the WireGuard Secret's name is stated once,
# for both the Site and the gateway's RBAC. It carries helm.sh/resource-policy: keep, so helm uninstall and an upgrade
# with create false leave it in place (docs/runbooks/rollback.md).
site:
  create: true
  # The site's name. Required when create is true.
  name: ""
  # Site.spec, as in api/v1. Example:
  # spec:
  #   wireguard:
  #     privateKeySecretRef: {name: strait-wireguard}
  spec: {}

# The cnpg plugin: the controller's read access to CloudNativePG's kinds, and its watch of them. With false, the
# controller neither reads nor watches them, and reports every member of a SiteService with the cnpg plugin Unknown,
# reason PluginDisabled (docs/getting-started.md).
cnpg:
  enabled: true

# Objects of the Prometheus Operator (docs/metrics.md). Off by default: their CRDs must exist.
metrics:
  # PodMonitors of the controller, port 8080, and of every gateway pod, port 8091: the agent's /metrics, and Envoy's
  # stats at /stats/prometheus.
  podMonitor:
    enabled: false
    # Labels that the Prometheus's podMonitorSelector requires.
    labels: {}
    interval: 30s
  # A PrometheusRule with the alert rules of files/alerts.yaml.
  prometheusRule:
    enabled: false
    # Labels that the Prometheus's ruleSelector requires.
    labels: {}

networkPolicy:
  # A policy on the controller pod: only gateway pods reach its observation and xDS ports.
  enabled: true
  # The sources that may reach the metrics ports, the controller's 8080 and the gateway's 8091, as NetworkPolicy peers,
  # for example [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]. Empty admits every
  # source. The metrics are plain HTTP.
  metricsFrom: []
  gateway:
    # A policy on the gateway pods. It admits every source to the probes, metricsFrom to the metrics, every pod of
    # this cluster to the import and export ports, the controller to the peer port, and peerCIDRs to the control and
    # export ports and wireGuardPorts. Off by default: where peer traffic comes from depends on the gateway Services' type and on the CNI (RFC0007), so a
    # default would cut the peers off. The ports come from site.spec.gateway, and the Site CRD's defaults where it sets
    # none.
    enabled: false
    # The addresses that the peer gateways connect from, as CIDRs: their gateway pods' addresses, or their nodes'
    # addresses where their clusters masquerade traffic that leaves them. With NodePort gateway Services, set
    # externalTrafficPolicy Local, so that the gateway pod sees the peer's address.
    peerCIDRs: []
    # The UDP listen ports of the site's wireguard SiteLinks, which peerCIDRs reach. The chart does not read
    # SiteLinks. Required with peerCIDRs, and the chart fails to render without it: [] for a site with no wireguard
    # link. Example: [31820]
    # wireGuardPorts: []
    # The gateway's ports, with site.create false only, as in the Site's spec.gateway. All four are required then,
    # and the chart fails to render without them. Example:
    # ports:
    #   controlPort: 30900
    #   exportPorts: {first: 30901, last: 31899}
    #   importPorts: {first: 15000, last: 15999}
    #   peerPort: 14999
    ports: {}
