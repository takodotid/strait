            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SiteLinkSpec sets a link's peer, transport, cost and addresses.
            properties:
              cost:
                default: 100
                description: Cost orders the links to one peer. Traffic uses the healthy
                  link with the lowest cost, then the lowest name.
                format: int32
                maximum: 65535
                minimum: 0
                type: integer
              direct:
                description: Direct holds the settings of a direct link.
                properties:
                  address:
                    description: Address is the peer gateway's IP address on this
                      link.
                    maxLength: 45
                    type: string
                    x-kubernetes-validations:
                    - message: must be an IP address
                      rule: isIP(self)
                  endpointDirect:
                    description: EndpointDirect points application names straight
                      at the remote member's addresses while this link is the active
                      link, with no gateway hop. Pod addresses must be routable over
                      the link.
                    type: boolean
                required:
                - address
                type: object
              encryption:
                description: Encryption must be None on a direct link, set explicitly.
                  It is WireGuard on a wireguard link.
                enum:
                - None
                - WireGuard
                type: string
              peer:
                description: Peer is the name of the SitePeer at the other end.
                maxLength: 63
                minLength: 1
                type: string
              transport:
                description: Transport is how the link carries traffic.
                enum:
                - direct
                - wireguard
                type: string
              wireguard:
                description: WireGuard holds the settings of a wireguard link.
                properties:
                  address:
                    description: Address is this side's tunnel address, in CIDR notation.
                    maxLength: 49
                    type: string
                    x-kubernetes-validations:
                    - message: must be an address in CIDR notation
                      rule: isCIDR(self)
                  endpoint:
                    description: Endpoint is the peer's host:port to dial. Empty means
                      this side waits for the peer to dial.
                    type: string
                  listenPort:
                    default: 31820
                    description: |-
                      ListenPort is the local UDP port of this link's interface.
                      With a NodePort or LoadBalancer WireGuard Service, the node port equals it, so it must be in the cluster's node port range.
