                    maximum: 65535
                    minimum: 1
                    type: integer
                  peerAddress:
                    description: PeerAddress is the peer's tunnel address.
                    maxLength: 45
                    type: string
                    x-kubernetes-validations:
                    - message: must be an IP address
                      rule: isIP(self)
                  persistentKeepalive:
                    default: 25s
                    description: PersistentKeepalive keeps the path open from the
                      dialing side.
                    type: string
                required:
                - address
                - peerAddress
                type: object
            required:
            - peer
            - transport
            type: object
            x-kubernetes-validations:
            - message: set direct for the direct transport, wireguard for the wireguard
                transport, and not the other
              rule: 'self.transport == ''direct'' ? (has(self.direct) && !has(self.wireguard))
