# On a tag vX.Y.Z: the multi-arch image, the CLI archives, the Helm chart, and the GitHub release.
name: release
on:
  push:
    tags: ['v*']
# Each job states what it may do (RFC0007, requirement 19).
permissions: {}
# pipefail in every step.
defaults:
  run:
    shell: bash
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # A signed tag on main, whose ci run on main succeeded, and a version that no release published (RFC0007,
  # requirements 17 and 20). The environment lets the operator require a review before anything runs.
  gate:
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Signed tag on main, with ci green
        env:
          GH_TOKEN: ${{ github.token }}
        run: hack/release/gate.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Version not published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          hack/release/absent.sh oci "ghcr.io/takodotid/strait:$v" "ghcr.io/takodotid/charts/strait:$v"
          hack/release/absent.sh release "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
  # Every Go program of the release runs here, before any push, with read access only (RFC0007, requirements 18
  # and 19). The archives go to publish.
  test:
    runs-on: ubuntu-26.04
    needs: gate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Modules come from the proxy, checked against go.sum, not from a cache that another run saved.
          cache: false
      - uses: ./.github/actions/setup-helm
      - run: make verify test
      # The time of every entry of the archives, which make dist writes and hack/distcheck checks (RFC0006,
      # requirement 17). Set after the tests, which set their own.
      - name: The commit's time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: CLI archives
        run: |
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            make dist VERSION="$GITHUB_REF_NAME" GOOS="${p%/*}" GOARCH="${p#*/}"
          done
          cat config/crd/*.yaml > dist/strait-crds.yaml
      # One archive per platform, each with its files and man pages, and binaries of its platform that carry the version
      # and the commit. Each entry with the time SOURCE_DATE_EPOCH, no owner, and a fixed mode (RFC0006, requirements
      # 10, 13, 15, 16 and 17).
      - name: Check the CLI archives
        run: |
          go run ./hack/gendocs "$RUNNER_TEMP/man"
          go run ./hack/distcheck -version "$GITHUB_REF_NAME" -commit "$GITHUB_SHA" -man "$RUNNER_TEMP/man" archives dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/strait-crds.yaml
          if-no-files-found: error
  # The image, pushed by its digest with no tag, and signed keyless with this workflow's identity (RFC0007,
  # requirements 22 and 23). Its index holds the platform images only, so that a rebuild from the tag gives its digest
  # (requirement 30). Each platform image carries BuildKit's provenance and SBOM as cosign attestations, apart from the
  # index. publish moves the tags last. The builds run Go in BuildKit's build containers, which get neither this job's
  # environment nor its credentials.
  image:
    runs-on: ubuntu-26.04
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build time: two builds of one commit then give the same platform images (Dockerfile).
      - name: The commit's time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # The multi-arch index carries the source and licence too, not only each platform's image.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/takodotid/strait
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          outputs: type=image,name=ghcr.io/takodotid/strait,push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          sbom: false
          # No build cache: every layer of a release comes from this build.
          no-cache: true
      - uses: ./.github/actions/setup-cosign
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/takodotid/strait@$DIGEST"
      # A second build of the commit, from scratch, with BuildKit's provenance and SBOM, into an OCI layout on the
      # runner. It pushes nothing.
      - name: Build the attestations
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          outputs: type=oci,dest=${{ runner.temp }}/attested.tar,rewrite-timestamp=true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max,version=v1
          sbom: true
          no-cache: true
      # attest.sh attests nothing unless the second build gave each pushed platform image, by the same digest.
      - name: Attest the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir "$RUNNER_TEMP/attested"
          tar -xf "$RUNNER_TEMP/attested.tar" -C "$RUNNER_TEMP/attested"
          docker buildx imagetools inspect --raw "ghcr.io/takodotid/strait@$DIGEST" >"$RUNNER_TEMP/index.json"
          hack/release/attest.sh "ghcr.io/takodotid/strait@$DIGEST" "$RUNNER_TEMP/index.json" "$RUNNER_TEMP/attested"
  # The image's binaries, of each platform and with the version and the commit, and its man pages (RFC0006,
  # requirements 10 and 13). Its index, with the platform images only, and its signature and attestations (RFC0007,
  # requirements 23 and 30). It runs the image's strait on the runner, so it can write nothing (RFC0007, requirement
  # 19). The image is public, so the pull needs no credential. publish needs it.
  image-check:
    runs-on: ubuntu-26.04
    needs: image
    permissions:
      contents: read
    env:
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check the image
        run: |
          go run ./hack/gendocs "$RUNNER_TEMP/man"
          for arch in amd64 arm64; do
            id=$(docker create --pull always --platform "linux/$arch" "ghcr.io/takodotid/strait@$DIGEST")
            docker export "$id" > "$RUNNER_TEMP/image-$arch.tar"
            docker rm "$id"
            go run ./hack/distcheck -version "$GITHUB_REF_NAME" -commit "$GITHUB_SHA" -man "$RUNNER_TEMP/man" image "$arch" "$RUNNER_TEMP/image-$arch.tar"
          done
      - uses: ./.github/actions/setup-cosign
      - name: Check the index, its signature and the attestations
        run: |
          docker buildx imagetools inspect --raw "ghcr.io/takodotid/strait@$DIGEST" >"$RUNNER_TEMP/index.json"
          go run ./hack/distcheck -version "$GITHUB_REF_NAME" -commit "$GITHUB_SHA" index "$DIGEST" "$RUNNER_TEMP/index.json"
          id="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yaml@$GITHUB_REF"
          issuer=https://token.actions.githubusercontent.com
          cosign verify "ghcr.io/takodotid/strait@$DIGEST" --certificate-identity "$id" --certificate-oidc-issuer "$issuer" >/dev/null
          for image in $(jq -r '.manifests[].digest' "$RUNNER_TEMP/index.json"); do
            for type in slsaprovenance1 spdxjson; do
              cosign verify-attestation "ghcr.io/takodotid/strait@$image" --type "$type" --certificate-identity "$id" --certificate-oidc-issuer "$issuer" >/dev/null
            done
          done
  # The chart, which names the image by its digest, the attestations, the GitHub release, and the image's tags last.
  # Everything that can fail without a push runs first. Each push checks again, right before it, that its version is
  # not published (RFC0007, requirements 20 to 23). No Go runs here.
  publish:
    runs-on: ubuntu-26.04
    needs: [test, image, image-check]
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: ./.github/actions/setup-helm
      - uses: ./.github/actions/setup-cosign
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package the chart
        run: hack/release/chart.sh "$GITHUB_REF_NAME" "$DIGEST"
      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip *.tgz strait-crds.yaml > SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.tgz
            dist/strait-crds.yaml
            dist/SHA256SUMS
      - name: Push and sign the chart
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          hack/release/absent.sh oci "ghcr.io/takodotid/charts/strait:$v"
          printf '%s' "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "dist/strait-$v.tgz" oci://ghcr.io/takodotid/charts
          chart=$(hack/release/digest.sh "ghcr.io/takodotid/charts/strait:$v")
          cosign sign --yes "ghcr.io/takodotid/charts/strait@$chart"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hack/release/absent.sh release "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
          cd dist
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Strait $GITHUB_REF_NAME" --generate-notes *.tar.gz *.zip *.tgz strait-crds.yaml SHA256SUMS
      - name: Image tags
        env:
          TAGS: ${{ needs.image.outputs.tags }}
        run: |
          hack/release/absent.sh oci "ghcr.io/takodotid/strait:${GITHUB_REF_NAME#v}"
          mapfile -t tags <<<"$TAGS"
          hack/release/tags.sh "ghcr.io/takodotid/strait@$DIGEST" "${tags[@]}"
