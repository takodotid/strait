# Vale lints the prose of the repository against the rules of AGENTS.md, Writing. Run it with make prose.
StylesPath = hack/vale

# The text of a Vue template is prose. Its script and its style are not read.
[formats]
vue = html

[*.{md,vue}]
BasedOnStyles = Strait

# Go comments: only the history rule.
[*.go]
Strait.History = YES
