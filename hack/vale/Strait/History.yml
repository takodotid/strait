# AGENTS.md, Keeping text lean: no history anywhere.
extends: existence
message: "'%s' is history. Remove the reference; git holds it."
level: error
nonword: true
tokens:
  # Issue and PR numbers. RFC numbers have four digits ([RFC#0002]), so they don't match.
  - '\(#\d{1,3}\)'
  - '#\d{1,3},? (?:row|item) \d+'
  - 'found in (?:a )?review'
